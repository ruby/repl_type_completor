name: test

on:
  push:
  pull_request:
  schedule:
    - cron: "30 14 * * *"

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby
      min_version: 3.0

  test-ruby-versions:
    needs: ruby-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  test-rbs-versions:
    needs: ruby-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rbs: ['latest', '4.2', '4.0', '3.10', '3.8', '3.4', '2.7.0']
    env:
      GEMFILE_RBS_VERSION: ${{ matrix.rbs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: ${{ fromJson(needs.ruby-versions.outputs.latest) }}
          bundler-cache: true
      - run: bundle exec rake test

  test-prism-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prism: ['latest', '2.1.0', '2.0.0', '1.9.0', '1.7.0', '1.5.0', '1.0.0']
    env:
      GEMFILE_PRISM_VERSION: ${{ matrix.prism }}
      # prism <= 1.2.0 builds libprism with -Werror and hits a dangling-pointer warning on GCC 15 (fixed in ruby/prism#3658)
      CFLAGS: ${{ matrix.prism == '1.0.0' && '-Wno-error=dangling-pointer' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          # Ruby >= 4.1 uses Ruby::Prism instead of the prism gem
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test
